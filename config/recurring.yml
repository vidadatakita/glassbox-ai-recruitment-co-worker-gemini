# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # D60: technical-test expiry (no_show), the 24-hour reminder and gate-outcome notices. Every
  # page that shows a test also evaluates expiry lazily, so a late tick never shows a wrong state.
  technical_test_tick:
    class: TechnicalTestTickJob
    queue: default
    schedule: every 5 minutes
  # Three-step application form (17 Oct 2026): an unsubmitted draft is deleted once its vacancy's
  # portal is closed (it holds a person's details and CV without an application).
  application_draft_purge:
    class: ApplicationDraftPurgeJob
    queue: default
    schedule: every hour at minute 25
  # Vida 18 Oct 2026: a started test whose time ran out with the tab closed is sent automatically
  # (ApplicationDrafts::AutoSubmit). Every 5 minutes, so it runs well before the hourly purge.
  application_draft_auto_submit:
    class: ApplicationDraftAutoSubmitJob
    queue: default
    schedule: every 5 minutes
  # AI interview: closes an interview 30 minutes after its first question (or 48 hours after the
  # application without one), so S1 can run on the CV and the answers given.
  interview_tick:
    class: InterviewTickJob
    queue: default
    schedule: every 5 minutes
  # A5: the demo workspace goes back to its seed every night, 20:00 UTC = 03:00 WIB. Demo::Reset
  # refuses to run unless DEMO_MODE=1, so this line is harmless on a client install.
  demo_reset:
    class: DemoResetJob
    queue: default
    schedule: at 8pm every day
